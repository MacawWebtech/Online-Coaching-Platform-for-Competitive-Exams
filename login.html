<!DOCTYPE html>

<html dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>

<body class="redesigned-auth">
<main class="auth-wrap">
<section class="auth-art">
<span class="eyebrow" style="color:#1E40AF">
          Welcome back
        </span>
<h1 style="font-size:clamp(3rem,6vw,5.8rem);line-height:.95;margin:.5rem 0">
          Your preparation continues where you left it.
        </h1>
<p style="color:#FFFFFF;max-width:550px">
          Access courses, mock tests, score reports, resources and your personalized study plan.
        </p>
<div aria-hidden="true" class="auth-tech-wrap">
<div class="visual-image-box">
<img alt="Competitive exam preparation" loading="lazy" src="assets/images/heading-backgrounds/login.jpg"/>
</div></div>
</section>
<section class="auth-form">
<form autocomplete="on" class="auth-card" onsubmit="return authDemo(event,this)">
<a class="brand" href="index.html"><span aria-hidden="true" class="brand-mark"><svg fill="none" height="34" viewbox="0 0 40 40" width="34"><path d="M7 31 20 6l13 25H7Z" stroke="currentColor" stroke-linejoin="round" stroke-width="2.8"></path><path d="M14 25h12M17 19h6" stroke="currentColor" stroke-linecap="round" stroke-width="2.8"></path></svg></span><span class="brand-name">Examora<span class="brand-dot">.</span></span></a>
<div style="position:absolute;top:18px;right:18px;display:flex;gap:8px;">
<button aria-label="Toggle RTL" class="icon-btn rtl-toggle" onclick="toggleRTL()" title="RTL" type="button">RTL</button>
<button aria-label="Toggle dark mode" class="icon-btn" onclick="toggleTheme()" title="Theme" type="button"><svg aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="20"><path d="M20.985 12.486A9 9 0 0 1 11.514 3.015 9 9 0 1 0 20.985 12.486Z"></path></svg></button>
</div>
<h2>Student Login</h2>
<p class="muted">Sign in to continue your preparation.</p>
<label class="field">
<span>Email</span>
<input autocomplete="email" name="email" placeholder="you@example.com" required="" type="email"/>
</label>
<label class="field">
<span>Password</span>
<input autocomplete="current-password" id="login-password" name="password" placeholder="Enter password" required="" type="password"/>

</label>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap">
<label class="small" style="display:flex;align-items:center;gap:6px;cursor:pointer">
<input name="remember" type="checkbox"/>
Remember me
</label>
<a class="small" href="#" style="color:var(--primary);font-weight:700">Forgot password?</a>
</div>
<button class="btn btn-primary" style="width:100%;margin-top:18px" type="submit">Login</button>
<div style="margin:20px 0;display:flex;align-items:center;gap:12px">
<span style="flex:1;height:1px;background:var(--line)"></span>
<span class="small muted">or continue with</span>
<span style="flex:1;height:1px;background:var(--line)"></span>
</div>
<div style="display:flex;gap:10px;justify-content:center">
<button aria-label="Google sign-in (requires configuration)" class="btn btn-light" onclick="authProviderUnavailable(this)" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px" title="Requires an OAuth connection" type="button">
<svg height="18" viewbox="0 0 24 24" width="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
Google
</button>
<button aria-label="Apple sign-in (requires configuration)" class="btn btn-light" onclick="authProviderUnavailable(this)" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px" title="Requires an OAuth connection" type="button">
<svg fill="currentColor" height="18" viewbox="0 0 24 24" width="18"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path></svg>
Apple
</button>
</div>
<p class="small muted" style="text-align:center;margin-top:18px">
New here? <a href="register.html" style="color:var(--primary);font-weight:800">Create account</a>
</p>
<p aria-live="polite" class="auth-status" role="status"></p></form>
</section>
</main>
<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  if (input.type === "password") { input.type = "text"; btn.setAttribute("aria-label","Hide password"); }
  else { input.type = "password"; btn.setAttribute("aria-label","Show password"); }
}
</script>
<script src="assets/js/main.js"></script>
<script defer src="assets/js/academy.js"></script><script src="assets/js/final-qc-fixes.js" defer></script>
</body>
</html>
